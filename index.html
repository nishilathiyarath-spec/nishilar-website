<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nishilar | Coming Soon</title>
  <meta name="description" content="Nishilar website is currently under development.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow hidden;
      display: grid;
      place-items: start center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 20%, rgba(70,90,120,.22), transparent 35%),
        linear-gradient(160deg, #05070b, #0b111a 55%, #050608);
    }
    main {
      width: min(92%, 720px);
      text-align: center;
      padding: 10px 24px;
    }
    .image-wrap {
      width: min(100%, 270px);
      margin: 0 auto 5px;
      padding: 8px;
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 18px;
    }
    h1 {
      margin: 0 0 3px;
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: .04em;
      font-weight: 650;
    }
    .coming {
      margin: 0 0 12px;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      color: #d9e1eb;
    }
    .note {
      margin: 0 auto 10px;
      max-width: 560px;
      color: #9faaba;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 20px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,.07);
    }
    a:hover { background: rgba(255,255,255,.13); }
    footer {
      margin-top: 4px;
      color: #687384;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="image-wrap">
      <img src="maya-world.jpg" alt="Maya World">
    </div>
    <h1>Nishilar</h1>
    <p class="coming">Something special is on the way.</p>
    <p class="note">Our website is currently under development. Please check back soon.</p>
    <a href="mailto:nishilathiyarath@gmail.com">Contact: nishilathiyarath@gmail.com</a>
    <footer>© 2026 Nishilar. All rights reserved.</footer>
  </main>
</body>
</html>
